name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: voicePitchFeedback-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: voicePitchFeedback-windows.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: voicePitchFeedback-mac.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up MSVC dev environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (linux)
        if: matrix.os == 'ubuntu-latest'
        run: .github/scripts/build-linux.sh ${{ matrix.target }} ${{ matrix.artifact }}

      - name: Build (windows)
        # Do not run this step under bash. Git for Windows includes its own
        # link.exe in usr/bin. Under bash, that link.exe comes before the
        # MSVC link.exe on PATH. Rustc then finds the wrong link.exe and the
        # link step fails.
        if: matrix.os == 'windows-latest'
        env:
          # cmake-rs picks a "Visual Studio NN" generator by itself. It
          # fails on VS versions it does not recognize yet (for example, VS
          # 2026 "18.0" next to VS 2022 on windows-latest runners). The
          # NMake Makefiles generator only needs cl.exe and nmake.exe on
          # PATH. msvc-dev-cmd above adds them to PATH. This generator
          # skips the version lookup.
          CMAKE_GENERATOR: NMake Makefiles
          # This explicit generator stops cmake-rs from forcing its usual
          # flags. Without those flags, RtAudio's CMakeLists.txt changes
          # the default debug flag "/MDd" to "/MTd" (static debug CRT).
          # That does not match Rust's dynamic release CRT, and the link
          # step fails with unresolved symbols such as _CrtDbgReport and
          # _malloc_dbg. This toolchain file forces "/MD" instead. See
          # .github/cmake/windows-crt.cmake for details.
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/.github/cmake/windows-crt.cmake
          # This flag links the CRT statically. The built .exe then does
          # not need the VC++ Redistributable (MSVCP140.dll,
          # VCRUNTIME140.dll) on the target machine. This must match the
          # static release CRT that windows-crt.cmake forces RtAudio to
          # use above.
          RUSTFLAGS: -C target-feature=+crt-static
          VFSRAC_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }} -p voice-pitch-feedback

      - name: Stage binary (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/voice-pitch-feedback.exe dist/${{ matrix.artifact }}

      - name: Build .app bundle (macos)
        if: matrix.os == 'macos-latest'
        run: .github/scripts/build-macos.sh ${{ matrix.target }}

      - name: Sign and notarize .app (macos)
        # Builds unsigned until the Developer ID cert/notarization secrets
        # exist (see .claude/macos-code-signing-plan.md) - sign-macos.sh
        # checks for them itself and no-ops if they're absent.
        if: matrix.os == 'macos-latest'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: .github/scripts/sign-macos.sh ${{ matrix.target }}

      - name: Verify signing (macos)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: .github/scripts/verify-macos-signing.sh ${{ matrix.target }} "${{ secrets.APPLE_SIGNING_IDENTITY }}"

      - name: Package .app (macos)
        if: matrix.os == 'macos-latest'
        run: |
          app=$(echo target/${{ matrix.target }}/release/bundle/osx/*.app)
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
        continue-on-error: true

      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \; 2>/dev/null || true
          ls -la release

      - name: Check for artifacts
        id: check
        run: |
          if [ -z "$(ls -A release)" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
