[workspace]
members = [
  "crates/neo-audio",
  "crates/realtime-tools",

  "voice-pitch-feedback",
]
# `cargo build`/`run` without `-p` only builds the app, not every workspace
# member. Building `neo-audio` on its own (as opposed to as a dependency)
# uses its own Cargo.toml defaults (portaudio-backend), which doesn't build
# on Windows and isn't what the app needs.
default-members = ["voice-pitch-feedback"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.95"
version = "0.2.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neodsp/neo-audio"
keywords = ["audio"]
categories = ["multimedia::audio"]
authors = ["Stephan Eckes <stephan@neodsp.com>"]
homepage = "https://neodsp.com"
readme = "README.md"

[profile.dev.package."*"]
opt-level = 2 # Optimize all dependencies in debug build

[profile.dev.package.rtaudio-sys]
# Force this to opt-level 0 so the `cmake` crate maps to a true CMake "Debug"
# build, in both dev and release profiles. Any other opt-level maps to
# "RelWithDebInfo" or "Release", which omit the "d" debug-postfix that
# rtaudio-sys's build.rs hardcodes looking for on Windows (rtaudiod.lib),
# causing a link failure regardless of profile.
opt-level = 0

[profile.release.package.rtaudio-sys]
opt-level = 0

[workspace.dependencies]
neo-audio = { path = "crates/neo-audio", default-features = false }
realtime-tools = { path = "crates/realtime-tools" }

cpal = "0.15.3"
crossbeam-channel = "0.5.13"
easer = "0.3.0"
ndarray = "0.16.1"
ringbuf = "0.4.7"
rtaudio = "0.3.3"
serde = "1.0.215"
thiserror = "2.0.3"
portaudio = "0.8.0"
